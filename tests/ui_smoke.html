<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>PENDING</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="../2brain.html" style="width:900px;height:600px"></iframe>
<script>
/* UI 回归：详情页 + 「相关记忆」降级（桥不可达也不能卡死界面） */
var ERRS = 0;
function log(name, ok, extra){
  if(!ok) ERRS++;
  return 'CHECK ' + (ok ? 'OK   ' : 'FAIL ') + name + (extra !== undefined && extra !== '' ? '  [' + String(extra).slice(0,140) + ']' : '');
}
var lines = [];
(async function(){
  try {
    localStorage.removeItem('sb_nodes'); localStorage.removeItem('sb_notes');
    localStorage.removeItem('sb_favorites'); localStorage.removeItem('sb_snapshots');
    localStorage.setItem('sb_settings', JSON.stringify({
      classifierMode:'rule', summaryOn:false,
      sync:{ providerId:'off', bridge:'http://127.0.0.1:7999', url:'', key:'', autoMemory:false, relatedOn:true, agentOn:true }
    }));
    localStorage.setItem('sb_favorites', JSON.stringify([
      {nodeId:'c1', pinned:true, pinOrder:1, hidden:false, useCount:6, lastUsed:T0-3600e3},
      {nodeId:'cw', pinned:false, pinOrder:0, hidden:false, useCount:3, lastUsed:T0-7200e3}
    ]));
    /* 确定性种子：两级树 + 三条笔记（父根/子叶各挂） */
    var T0 = Date.now();
    localStorage.setItem('sb_nodes', JSON.stringify([
      {id:'r1', name:'生活', root:true, parentId:null, order:1, keywords:[]},
      {id:'c1', name:'装修', parentId:'r1', order:1, keywords:[]},
      {id:'w1', name:'工作', root:true, parentId:null, order:2, keywords:[]},
      {id:'cw', name:'思路', parentId:'w1', order:1, keywords:[]},
      {id:'cw2', name:'复盘', parentId:'w1', order:2, keywords:[]}
    ]));
    localStorage.setItem('sb_notes', JSON.stringify([
      {id:'n1', nodeId:'r1', content:'生活根下的便签甲', status:'待处理', createdAt:T0-1000, updatedAt:T0-1000, links:[], tags:[]},
      {id:'n2', nodeId:'c1', content:'装修贴砖进度记录', status:'进行中', createdAt:T0-2000, updatedAt:T0-2000, links:[], tags:['装修']},
      {id:'n3', nodeId:'cw', content:'思路里的一句灵感', status:'长期', createdAt:T0-3000, updatedAt:T0-3000, links:[], tags:[]},
      {id:'n4', content:'很久之前的零散旧记忆', status:'长期', createdAt:T0-40*864e5, updatedAt:T0-40*864e5, links:[], tags:[]}
    ]));
  } catch(e){ lines.push(log('prepare', false, e)); finish(); return; }

  await new Promise(function(res){ setTimeout(res, 600); });
  var w = document.getElementById('f').contentWindow;
  var doc = w.document;

  try { lines.push(log('list rendered (.ncard)', !!doc.querySelector('.ncard'))); }
  catch(e){ lines.push(log('list render', false, e && e.message)); finish(); return; }

  // 打开设置（改过 renderDetail 之外的 openSettings → 可能炸 / '#'+id bug 曾在这里）
  doc.querySelectorAll('.navbtn').forEach(function(x){ if(x.dataset.view==='settings'){ x.click(); } });
  await new Promise(function(res){ setTimeout(res, 200); });
  var setM = doc.getElementById('setModal');
  lines.push(log('settings modal opens', setM && setM.classList.contains('on')));
  lines.push(log('provider select exists', !!doc.getElementById('setSyncProv')));
  lines.push(log('bridge input exists', !!doc.getElementById('setBridgeUrl')));
  /* P4：本机存储与加密卡（localStorage 模式给「迁移到 IndexedDB」入口） */
  var encCard = Array.prototype.filter.call(doc.querySelectorAll('#setBody .setcard'), function(c){
    return /本机存储与加密/.test(((c.querySelector('h3')||{}).textContent) || '');
  })[0];
  lines.push(log('storage/encryption card exists', !!encCard));
  lines.push(log('encryption card offers enable in localStorage mode', !!doc.getElementById('btnEncOn')
    && /迁移到 IndexedDB/.test((doc.getElementById('btnEncOn')||{}).textContent || '')));
  lines.push(log('encryption card shows backend', !!encCard && /localStorage/.test(encCard.textContent || '')));

  /* 分为引擎补丁：读取模型 + 测试模型双按钮（空 URL 会就地提示，不发请求） */
  lines.push(log('model fetch & test buttons exist',
    !!doc.getElementById('btnFetchModels') && !!doc.getElementById('btnTestModel')));
  doc.getElementById('btnTestModel').click();
  await new Promise(function(res){ setTimeout(res, 120); });
  lines.push(log('test without url leaves inline hint',
    /请先填写 Base URL/.test(doc.getElementById('modelTestTip').textContent || '')));
  doc.getElementById('setAiUrl').value = 'http://127.0.0.1:9/v1/';    // 占位端口：必拒，测全链路报错路径
  doc.getElementById('setAiModel').value = 'smoke-model';
  doc.getElementById('btnTestModel').click();
  await new Promise(function(res){ setTimeout(res, 1600); });
  lines.push(log('test dead endpoint reports failure reason',
    /测试失败/.test(doc.getElementById('modelTestTip').textContent || '')));
  /* 思考型模型（qwen3 系）：content 为空、只有 reasoning_content → 不能误判失败 */
  var realFetch = w.fetch;
  var seenBodies = [];
  w.fetch = function(u, o){
    if(o && o.body) seenBodies.push(String(o.body));
    return Promise.resolve({ status:200, ok:true, text:function(){
    return Promise.resolve(JSON.stringify({ model:'qwen3.8-flash',
      choices:[{ index:0, finish_reason:'stop',
        message:{ role:'assistant', content:null, reasoning_content:'think…the answer is 正常' } }] }));
  }}); };
  doc.getElementById('btnTestModel').click();
  await new Promise(function(res){ setTimeout(res, 1200); });
  var tipR = doc.getElementById('modelTestTip').textContent || '';
  lines.push(log('reasoning-only reply accepted (thinking model)',
    /✓ 模型正常/.test(tipR) && /思考型模型/.test(tipR), tipR));
  /* content 里混着  thinking…<｜end▁of▁thinking｜> 时先剥标签再判定 */
  w.fetch = function(){ return Promise.resolve({ status:200, ok:true, text:function(){
    return Promise.resolve(JSON.stringify({ model:'m',
      choices:[{ index:0, finish_reason:'stop',
        message:{ role:'assistant', content:'<think>internal reasoning</think>正常' } }] }));
  }}); };
  doc.getElementById('btnTestModel').click();
  await new Promise(function(res){ setTimeout(res, 1200); });
  var tipT = doc.getElementById('modelTestTip').textContent || '';
  lines.push(log('think tags stripped from content', /回复「正常」/.test(tipT), tipT));
  lines.push(log('chat payload carries reasoning_effort=none',
    /reasoning_effort/.test(seenBodies.join('\n')) && /none/.test(seenBodies.join('\n'))));
  w.fetch = realFetch;
  lines.push(log('via-bridge toggle exists & default on',
    !!doc.getElementById('setAiVia') && doc.getElementById('setAiVia').checked));
  doc.getElementById('setAiVia').click();
  await new Promise(function(res){ setTimeout(res, 900); });
  var stV = JSON.parse((localStorage.getItem('sb_settings')||'{}'));
  lines.push(log('via-bridge toggle persists off',
    !!stV.ai && stV.ai.viaBridge === false));
  doc.getElementById('setAiVia').click();
  await new Promise(function(res){ setTimeout(res, 600); });

  // 列表筛选（完成状态 / 日历选日期 / 整月 / 清空）
  var stSel = doc.getElementById('statusSel'), dateBtn = doc.getElementById('datePickBtn'),
      datePop = doc.getElementById('datePop');
  lines.push(log('status & calendar filters exist', !!stSel && !!dateBtn && !!datePop));
  if(stSel){
    stSel.value = '长期';
    stSel.dispatchEvent(new w.Event('change', { bubbles:true }));
    await new Promise(function(res){ setTimeout(res, 120); });
    lines.push(log('status filter keeps only 长期', doc.querySelectorAll('#list .ncard').length === 2,
      'cnt=' + doc.querySelectorAll('#list .ncard').length));
    stSel.value = 'all';
    stSel.dispatchEvent(new w.Event('change', { bubbles:true }));
    await new Promise(function(res){ setTimeout(res, 120); });
  }
  if(dateBtn && datePop){
    dateBtn.click();
    await new Promise(function(res){ setTimeout(res, 150); });
    lines.push(log('date filter opens a calendar popover',
      !datePop.hidden && datePop.querySelectorAll('.calday').length === 42,
      'cells=' + datePop.querySelectorAll('.calday').length));
    var dots = datePop.querySelectorAll('.calday .dot').length;
    lines.push(log('days with notes show a dot', dots >= 1, 'dots=' + dots));
    var todayCell = datePop.querySelector('.calday.today');
    lines.push(log('today is highlighted in the calendar', !!todayCell));
    lines.push(log('calendar hints the two-click range',
      /再点一天/.test(datePop.textContent || ''), datePop.textContent.slice(0, 60)));
    if(todayCell){
      var dnow = new Date();
      var dkey = dnow.getFullYear() + '-' + ('0'+(dnow.getMonth()+1)).slice(-2) + '-' + ('0'+dnow.getDate()).slice(-2);
      todayCell.click();
      await new Promise(function(res){ setTimeout(res, 150); });
      lines.push(log('first click marks the start, filters that day, popover stays open',
        !datePop.hidden && !!datePop.querySelector('.calday.on.from')
        && doc.querySelectorAll('#list .ncard').length === 3,
        'open=' + !datePop.hidden + ' cnt=' + doc.querySelectorAll('#list .ncard').length));
      lines.push(log('after the start click the hint asks for the end day',
        /再点一天/.test(datePop.textContent || '')));
      var other = null;
      Array.prototype.slice.call(datePop.querySelectorAll('.calday[data-day]')).forEach(function(c){
        if(!other && c.dataset.day !== dkey) other = c;
      });
      if(other){
        other.click();
        await new Promise(function(res){ setTimeout(res, 150); });
        lines.push(log('second click builds a range and closes the popover',
          datePop.hidden && /~/.test(dateBtn.textContent || '')
          && doc.querySelectorAll('#list .ncard').length === 3,
          dateBtn.textContent + ' / cnt=' + doc.querySelectorAll('#list .ncard').length));
        dateBtn.click();
        await new Promise(function(res){ setTimeout(res, 150); });
        var ends = datePop.querySelectorAll('.calday.on').length;
        var mids = datePop.querySelectorAll('.calday.mid').length;
        lines.push(log('range ends are dark, days in between are tinted',
          ends >= 1 && (mids >= 1 || dkey.slice(8) === '01'),
          'ends=' + ends + ' mids=' + mids));
        var allBtn = datePop.querySelector('[data-cal="all"]');
        allBtn.click();
        await new Promise(function(res){ setTimeout(res, 150); });
        lines.push(log('calendar "all" clears the range',
          /全部日期/.test(dateBtn.textContent || '') && doc.querySelectorAll('#list .ncard').length === 4,
          dateBtn.textContent + ' / cnt=' + doc.querySelectorAll('#list .ncard').length));
      }
      dateBtn.click();
      await new Promise(function(res){ setTimeout(res, 150); });
      var todayBtn = datePop.querySelector('[data-cal="today"]');
      todayBtn.click();
      await new Promise(function(res){ setTimeout(res, 150); });
      lines.push(log('picking a single day filters the list and closes the popover',
        doc.querySelectorAll('#list .ncard').length === 3 && datePop.hidden,
        'cnt=' + doc.querySelectorAll('#list .ncard').length));
      lines.push(log('date button shows the picked day',
        dateBtn.textContent.indexOf(dkey) === 0 && dateBtn.classList.contains('on'),
        dateBtn.textContent));
      var clr0 = doc.getElementById('listFilterClear');
      lines.push(log('filter clear button visible when filtered',
        !!clr0 && clr0.style.display !== 'none'));
      dateBtn.click();
      await new Promise(function(res){ setTimeout(res, 150); });
      var monthBtn = datePop.querySelector('[data-cal="month"]');
      lines.push(log('calendar offers whole-month filtering', !!monthBtn));
      if(monthBtn){
        monthBtn.click();
        await new Promise(function(res){ setTimeout(res, 150); });
        lines.push(log('month pick filters the list (hides 40-day-old note)',
          doc.querySelectorAll('#list .ncard').length === 3 && /整月/.test(dateBtn.textContent || ''),
          'cnt=' + doc.querySelectorAll('#list .ncard').length + ' / ' + dateBtn.textContent));
      }
    }
    var clr = doc.getElementById('listFilterClear');
    clr.click();
    await new Promise(function(res){ setTimeout(res, 150); });
    lines.push(log('filter clear restores list', doc.querySelectorAll('#list .ncard').length === 4,
      'cnt=' + doc.querySelectorAll('#list .ncard').length));
    lines.push(log('filter clear resets the date button', /全部日期/.test(dateBtn.textContent || '')));
  }

  // ③ 设置「暂存 + 保存生效 + 底部关闭」：切 Provider 只切分组不重渲染；改动要先点「保存同步设置」
  var sel = doc.getElementById('setSyncProv');
  sel.value = 'http';
  sel.dispatchEvent(new w.Event('change', { bubbles:true }));
  await new Promise(function(res){ setTimeout(res, 150); });
  lines.push(log('provider switch shows httpBox (no re-render jump)',
    doc.getElementById('httpBox').style.display === 'block'
    && doc.getElementById('mnBox').style.display === 'none'));
  lines.push(log('sync save button exists (staged mode)', !!doc.getElementById('btnSaveSync')));
  lines.push(log('agent master switch buttons exist',
    !!doc.getElementById('btnAgentOn') && !!doc.getElementById('btnAgentOff')));
  lines.push(log('agent master switch starts enabled (seed)',
    /已开启/.test((doc.getElementById('mnAgentState')||{}).textContent || '')
    && doc.getElementById('btnAgentOn').disabled && !doc.getElementById('btnAgentOff').disabled));
  var firstCard = doc.querySelector('#list .ncard');
  if(firstCard) firstCard.click();               // 确保详情仍在，才能验证相关记忆区被隐藏
  await new Promise(function(res){ setTimeout(res, 300); });
  doc.getElementById('btnAgentOff').click();
  await new Promise(function(res){ setTimeout(res, 500); });
  lines.push(log('agent master off persists and shows closed',
    /"agentOn":false/.test(localStorage.getItem('sb_settings') || '')
    && /已关闭/.test((doc.getElementById('mnAgentState')||{}).textContent || '')));
  lines.push(log('agent master off hides related section',
    doc.getElementById('dRelSec') && doc.getElementById('dRelSec').style.display === 'none'));
  var agentBlocked = false;
  try{ await w.brain.mnemon.push(); }
  catch(e){ agentBlocked = /已关闭/.test((e && e.message) || ''); }
  lines.push(log('agent master off blocks mnemon writes', agentBlocked));
  doc.getElementById('btnAgentOn').click();
  await new Promise(function(res){ setTimeout(res, 500); });
  lines.push(log('agent master on persists again',
    /"agentOn":true/.test(localStorage.getItem('sb_settings') || '')
    && /已开启/.test((doc.getElementById('mnAgentState')||{}).textContent || '')));
  lines.push(log('dirty tip shows after switching provider',
    /尚未生效/.test((doc.getElementById('syncSaveTip')||{}).textContent || '')));
  lines.push(log('close button sits in modal footer',
    !!doc.querySelector('#setModal .mfoot #setClose')));
  lines.push(log('settings footer always visible (flex column)',
    w.getComputedStyle(doc.querySelector('#setModal .modal')).display === 'flex'));
  lines.push(log('resize handles exist (settings & cate)',
    !!doc.getElementById('setRz') && !!doc.getElementById('cmRz')));
  sel.value = 'off';
  sel.dispatchEvent(new w.Event('change', { bubbles:true }));

  // 快照删除必须二次确认（confirm 驳回 → 不删；确认 → 删除并落盘）
  var snapNowBtn = doc.getElementById('btnSnapNow');
  snapNowBtn.click();
  await new Promise(function(res){ setTimeout(res, 400); });
  var C1 = JSON.parse((localStorage.getItem('sb_snapshots')||'[]')).length;
  var dropRows = doc.querySelectorAll('#setBody [data-op="drop"]');
  lines.push(log('manual snapshot created and listed', dropRows.length === C1 && C1 >= 1, 'rows=' + dropRows.length + ' C1=' + C1));
  var drop = dropRows[0];
  var cf = w.confirm;
  w.confirm = function(){ return false; };
  drop.click();
  await new Promise(function(res){ setTimeout(res, 300); });
  lines.push(log('snapshot drop needs confirm (rejected keeps snapshots)',
    JSON.parse((localStorage.getItem('sb_snapshots')||'[]')).length === C1));
  w.confirm = function(){ return true; };
  drop.click();
  await new Promise(function(res){ setTimeout(res, 400); });
  lines.push(log('snapshot drop confirmed removes',
    JSON.parse((localStorage.getItem('sb_snapshots')||'[]')).length === C1 - 1));
  w.confirm = cf;
  doc.querySelector('.mask.on') && doc.querySelectorAll('.mask.on').forEach(function(m){ m.classList.remove('on'); });
  doc.querySelectorAll('.navbtn')[0] && doc.querySelectorAll('.navbtn')[0].click();
  await new Promise(function(res){ setTimeout(res, 100); });

  // 选中一条笔记 → 详情
  var card = doc.querySelector('.ncard');
  card.click();
  await new Promise(function(res){ setTimeout(res, 250); });
  lines.push(log('detail rendered', !!doc.querySelector('#detail .dtitle')));
  var relSec = doc.getElementById('dRelSec'), relBox = doc.getElementById('dRel');
  lines.push(log('related section exists', !!relSec && !!relBox));
  lines.push(log('related section shown (bridge dead → graceful)', relSec && relSec.style.display !== 'none'));
  await new Promise(function(res){ setTimeout(res, 1200); });
  lines.push(log('related fallback text', /检索|失败|相关/.test(relBox.textContent || ''), (relBox.textContent||'').slice(0,60)));

  // 状态按钮 + 标签输入仍在（新增相关区块没破坏布局）
  lines.push(log('status buttons intact', doc.querySelectorAll('#detail [data-st]').length >= 4));
  lines.push(log('tag input intact', !!doc.getElementById('dTagInput')));
  lines.push(log('only the current status button keeps the tint (.pri)',
    (function(){
      var b = doc.querySelectorAll('#detail [data-st]');
      return b.length >= 4 && Array.prototype.filter.call(b, function(x){ return /(^|\s)pri(\s|$)/.test(x.className); }).length === 1;
    })()));

  /* ② 父分类显示子树 + ① 选中跟随视图 + ⑥ 锁定预设当前分类 */
  function trow(name){
    var out = null;
    doc.querySelectorAll('#tree .trow .tn').forEach(function(t){
      if(t.textContent === name) out = t.closest('.trow');
    });
    return out;
  }
  trow('生活').querySelector('.tn').click();
  await new Promise(function(res){ setTimeout(res, 250); });
  lines.push(log('root click lists whole subtree (n1+n2)',
    doc.querySelectorAll('#list .ncard').length === 2));
  lines.push(log('stale selected note still valid (kept in subtree)',
    /生活根下的便签甲/.test((doc.getElementById('detail')||{textContent:''}).textContent)));
  trow('装修').querySelector('.tn').click();
  await new Promise(function(res){ setTimeout(res, 250); });
  lines.push(log('leaf view filtered to subtree (n2 only)',
    doc.querySelectorAll('#list .ncard').length === 1));
  lines.push(log('detail follows view switch (stale selection cleared)',
    (doc.getElementById('detail')||{textContent:''}).textContent.indexOf('生活根下的便签甲') < 0));

  /* 树顶「全部」：不选分类也能回到全量列表（根分类点不到「所有笔记」的补充入口） */
  var allRow0 = trow('全部');
  lines.push(log('tree 全部 row sits at top', !!allRow0 && doc.querySelector('#tree .trow') === allRow0));
  lines.push(log('tree 全部 row shows total notes',
    !!allRow0 && allRow0.querySelector('.tc').textContent === '4',
    allRow0 && allRow0.querySelector('.tc').textContent));
  doc.querySelector('#tree .trow.tall').click();
  await new Promise(function(res){ setTimeout(res, 250); });
  var allRow1 = trow('全部');
  lines.push(log('tree 全部 click restores all notes',
    doc.querySelectorAll('#list .ncard').length === 4,
    'cards=' + doc.querySelectorAll('#list .ncard').length));
  lines.push(log('tree 全部 row selected after click', !!allRow1 && allRow1.classList.contains('sel')));
  lines.push(log('tree 全部 restores top-nav highlight', !!doc.querySelector('.navbtn[data-view="all"].on')));
  trow('装修').querySelector('.tn').click();     // 复原到叶子视图，后面的锁定用例依赖它
  await new Promise(function(res){ setTimeout(res, 200); });

  /* ⑧ 树里子分类右侧的「✚ 新建笔记」：子节点有、根分类没有；点了锁定目标 + 聚焦顶部输入框 */
  var rootRow = trow('生活'), childRow = trow('装修');
  lines.push(log('new-note button: child nodes only (not on root categories)',
    !!rootRow && !rootRow.querySelector('[data-act="newnote"]')
    && !!childRow && !!childRow.querySelector('[data-act="newnote"]')));
  if(childRow){
    childRow.querySelector('[data-act="newnote"]').click();
    await new Promise(function(res){ setTimeout(res, 200); });
    lines.push(log('new-note button locks the target node',
      /装修/.test((doc.getElementById('lockPath')||{textContent:''}).textContent || '')
      && /锁定/.test((doc.getElementById('modeBtn')||{textContent:''}).textContent || ''),
      'lockPath=' + ((doc.getElementById('lockPath')||{}).textContent || '')
      + ' mode=' + ((doc.getElementById('modeBtn')||{}).textContent || '')));
    doc.getElementById('modeBtn').click();     // 复位成自由模式，别影响后面的用例
    await new Promise(function(res){ setTimeout(res, 150); });
  }
  doc.getElementById('modeBtn').click();          // 锁定模式下点击 lockPath
  await new Promise(function(res){ setTimeout(res, 150); });
  doc.getElementById('lockPath').click();
  await new Promise(function(res){ setTimeout(res, 200); });
  lines.push(log('lock preset to current view node',
    /装修/.test(doc.getElementById('lockPath').textContent || '')));
  /* A：锁定态再点路径 → 全树选择器直切（免解锁）；B：最近收写入区 */
  doc.getElementById('lockPath').click();
  await new Promise(function(res){ setTimeout(res, 200); });
  lines.push(log('lock-path click opens full-tree picker (A)',
    doc.getElementById('pickModal').classList.contains('on')));
  lines.push(log('picker rows render', doc.querySelectorAll('#pmList .pickrow').length >= 1));
  var hitPM = null;
  doc.querySelectorAll('#pmList .pickrow').forEach(function(r){
    if(!hitPM && r.textContent.indexOf('思路') >= 0) hitPM = r;
  });
  if(hitPM) hitPM.click();
  await new Promise(function(res){ setTimeout(res, 300); });
  lines.push(log('lock switched without unlock (A)',
    /思路/.test(doc.getElementById('lockPath').textContent || '')));
  doc.getElementById('modeBtn').click();          // 解锁还原
  await new Promise(function(res){ setTimeout(res, 150); });

  /* C：/to 斜杠命令直达指定分类 */
  var taS = doc.getElementById('input');
  taS.value = '/to 装修 贴砖验收清单';
  doc.getElementById('submitBtn').click();
  await new Promise(function(res){ setTimeout(res, 800); });   // 等 commit 防抖落盘
  var notesNow = JSON.parse((localStorage.getItem('sb_notes')||'[]'));
  var aNew = notesNow.filter(function(x){ return x.content === '贴砖验收清单'; })[0];
  lines.push(log('slash /to routes note to target subtree node',
    !!aNew && aNew.nodeId === 'c1'));
  var st2 = JSON.parse((localStorage.getItem('sb_settings')||'{}'));
  lines.push(log('slash target remembered in recents (B)',
    (st2.recentTargets||[]).indexOf('c1') >= 0));
  taS.value = '/to 不存在的分类xyz 这条不该入库';
  doc.getElementById('submitBtn').click();
  await new Promise(function(res){ setTimeout(res, 250); });

      !rm.classList.contains('on') && JSON.parse(localStorage.getItem('sb_notes') || '[]').length > 0));
  }

  // 7) 版本号：根属性 / window.brain / 顶栏 三处必须一致；设置面板里也要能看到
  doc.querySelectorAll('.navbtn').forEach(function(x){ if(x.dataset.view==='settings'){ x.click(); } });
  await new Promise(function(res){ setTimeout(res, 200); });
  var verAttr = doc.documentElement.getAttribute('data-ver') || '';
  var verApi  = (w.brain && w.brain.pageVersion) || '';
  var verTagEl = doc.getElementById('verTag');
  var verTagT = (verTagEl ? verTagEl.textContent : '').trim();
  lines.push(log('page version consistent (data-ver / window.brain / topbar)',
    /^v\d{4}-\d{2}-\d{2}\.\d+$/.test(verAttr) && verAttr === verApi && verTagT === verAttr,
    'attr=' + verAttr + ' api=' + verApi + ' topbar=' + verTagT));
  var setVerEl = doc.getElementById('setVer');
  lines.push(log('settings panel shows page version',
    !!setVerEl && (setVerEl.textContent || '').trim() === verAttr,
    setVerEl ? setVerEl.textContent : 'no #setVer'));

  // 8) 标签页图标（脑形轮廓 + 一大一小两个齿轮）与笔记 ID 展示
  var iconEl = doc.querySelector('link[rel="icon"]');
  var iconHref = iconEl ? (iconEl.getAttribute('href') || '') : '';
  var iconCircles = (iconHref.match(/%3Ccircle/g) || []).length;
  var iconPaths = (iconHref.match(/%3Cpath/g) || []).length;
  lines.push(log('favicon is a lined brain with a big + small gear',
    /^data:image\/svg\+xml/.test(iconHref) && /fill='none'/.test(iconHref)
    && /stroke='%230f7a4a'/.test(iconHref) && iconCircles === 4 && iconPaths === 4
    && /stroke-width='1\.9'/.test(iconHref) && /stroke-width='1\.3'/.test(iconHref)
    && !/%F0%9F/.test(iconHref),
    'circles=' + iconCircles + ' paths=' + iconPaths + ' ' + iconHref.slice(0, 60)));
  doc.querySelectorAll('.navbtn').forEach(function(x){ if(x.dataset.view==='all'){ x.click(); } });
  await new Promise(function(res){ setTimeout(res, 250); });
  var idCard = doc.querySelector('#list .ncard');
  if(idCard){
    idCard.click();
    await new Promise(function(res){ setTimeout(res, 200); });
    var nidEl = doc.querySelector('#detail .dsub .nid');
    lines.push(log('detail shows a clickable short note id',
      !!nidEl && nidEl.dataset.copyid === idCard.dataset.id
      && (nidEl.textContent || '').replace(/^#/, '').length > 0
      && /点击复制/.test(nidEl.getAttribute('title') || ''),
      nidEl ? nidEl.textContent + ' / ' + nidEl.dataset.copyid : 'no .nid'));
  } else {
    lines.push(log('detail shows a clickable short note id', false, 'no .ncard'));
  }

  finish();
  function finish(){
    var pre = document.getElementById('out');
    pre.textContent = 'UI_ERRS=' + ERRS + '\n' + lines.join('\n');
    document.title = 'UI_DONE_' + ERRS;
  }
})();
</script>
</body>
</html>
