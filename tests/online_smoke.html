/* 在线模式（M1b）端到端回归。
   需要先跑 tests/api_stub.py，并经 http://127.0.0.1:7799/tests/online_smoke.html 打开。
   本页会用**独立的 WebCrypto 实现**解开服务器密文，验证客户端真的做了 E2EE。 */
var ERRS = 0, lines = [];
var NAME = 'smoke1', PW = 'correct horse 123', INVITE = 'ONLINESMOKEINVITE0001';
var TD = new TextDecoder(), TE = new TextEncoder();

function log(name, ok, extra){
  if(!ok) ERRS++;
  lines.push('CHECK ' + (ok ? 'OK   ' : 'FAIL ') + name
    + (extra !== undefined && extra !== '' ? '  [' + String(extra).slice(0,180) + ']' : ''));
  try{ document.title = 'P' + lines.length; }catch(e){}
  return ok;
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function until(fn, timeout){
  var t0 = Date.now();
  return (async function loop(){
    while(Date.now() - t0 < (timeout || 8000)){
      try{ if(await fn()) return true; }catch(e){}
      await wait(120);
    }
    return false;
  })();
}
function utf8(s){ return TE.encode(String(s)); }
function b64e(buf){
  var b = new Uint8Array(buf), s = '';
  for(var i = 0; i < b.length; i += 0x8000){
    s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
function b64d(text){
  var bin = atob(String(text || '')), out = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function api(path, opts){
  opts = opts || {};
  var init = { method: opts.method || 'GET', credentials:'same-origin',
               cache:'no-store', headers:{} };
  if(opts.body !== undefined){
    init.headers['Content-Type'] = 'application/json';
    init.body = typeof opts.body === 'string' ? opts.body : JSON.stringify(opts.body);
  }
  var r = await fetch('/api' + path, init);
  var t = await r.text(), j = null;
  try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok){
    var err = new Error((j && j.error && j.error.message) || ('HTTP ' + r.status));
    err.status = r.status; err.data = j;
    throw err;
  }
  return j;
}
function seedLocal(){
  var T0 = Date.now() - 86400000;
  localStorage.setItem('sb_nodes', JSON.stringify([
    {id:'work', name:'工作', root:true, parentId:null, order:1, keywords:[], icon:'',
     createdAt:T0, updatedAt:T0}
  ]));
  localStorage.setItem('sb_notes', JSON.stringify([
    {id:'n_local1', nodeId:'work', content:'迁移前本地笔记', status:'待处理',
     createdAt:T0, updatedAt:T0, links:[], tags:['迁移'], summary:''}
  ]));
  localStorage.setItem('sb_favorites', JSON.stringify([
    {nodeId:'work', pinned:true, pinOrder:1, hidden:false, useCount:4,
     lastUsed:T0, updatedAt:T0}
  ]));
  localStorage.setItem('sb_settings', JSON.stringify({
    classifierMode:'rule', favoriteMode:'smart', summaryOn:false,
    updatedAt:{ classifierMode:T0, favoriteMode:T0 },
    sync:{ providerId:'off', bridge:'http://127.0.0.1:7999', url:'', key:'', autoMemory:false, relatedOn:true }
  }));
  localStorage.removeItem('sb_snapshots');
}
/* P1 多库：当前库的键前缀随「活动库」变化；测试里统一经这些 helper 取本机数据 */
function activePrefix(){
  try{
    var v = W().brain.vaults.active() || {};
    return v.legacy ? 'sb_' : ('sb:v:' + v.id + ':');
  }catch(e){ return 'sb_'; }
}
function vaultPrefix(v){ return (v && v.legacy) ? 'sb_' : ('sb:v:' + (v && v.id) + ':'); }
function localNotes(){
  try{ return JSON.parse(localStorage.getItem(activePrefix() + 'notes') || '[]') || []; }
  catch(e){ return []; }
}
function dekKey(){
  try{
    var v = W().brain.vaults.active() || {};
    return v.legacy ? 'sb_dek' : ('sb:v:' + v.id + ':dek');
  }catch(e){ return 'sb_dek'; }
}
function metaKey(){
  try{
    var v = W().brain.vaults.active() || {};
    return v.legacy ? 'sb_online_meta' : ('sb:v:' + v.id + ':meta');
  }catch(e){ return 'sb_online_meta'; }
}


/* ---------- 独立加密实现（与页面同一套协议，但代码各自独立） ---------- */
async function pbkdf2(pw, salt, iter){
  var key = await crypto.subtle.importKey('raw', utf8(String(pw).normalize('NFKC')),
    { name:'PBKDF2' }, false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    { name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256' }, key, 256);
  return new Uint8Array(bits);
}
async function hkdf(raw, info){
  var key = await crypto.subtle.importKey('raw', raw, { name:'HKDF' }, false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits(
    { name:'HKDF', hash:'SHA-256', salt:new Uint8Array(0), info:utf8(info) }, key, 256);
  return new Uint8Array(bits);
}
async function aesKey(raw){
  return crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['encrypt','decrypt']);
}
async function aesDec(raw, iv, aad, ct){
  var key = await aesKey(raw);
  return new Uint8Array(await crypto.subtle.decrypt(
    { name:'AES-GCM', iv:iv, additionalData:aad, tagLength:128 }, key, ct));
}
async function aesEnc(raw, iv, aad, plain){
  var key = await aesKey(raw);
  return new Uint8Array(await crypto.subtle.encrypt(
    { name:'AES-GCM', iv:iv, additionalData:aad, tagLength:128 }, key, plain));
}
async function deriveKeys(pw, salt, iter){
  var master = await pbkdf2(pw, salt, iter);
  return { authHash: await hkdf(master, '2brain|auth|v1'),
           kek: await hkdf(master, '2brain|kek|v1') };
}
async function unwrapDek(kek, wrapped, iv, name){
  return aesDec(kek, b64d(iv), utf8('2brain|wrap|v1|' + name), b64d(wrapped));
}
async function encryptAs(dek, uid, bundle){
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var ct = await aesEnc(dek, iv, utf8('2brain|bundle|v1|' + uid), utf8(JSON.stringify(bundle)));
  return { v:1, iv:b64e(iv), ct:b64e(ct) };
}
async function readServer(meta, dek){
  var st = await api('/__state');
  if(!st.brain || !st.brain.blob) return { st:st, bundle:null };
  var plain = await aesDec(dek, b64d(st.brain.blob.iv),
    utf8('2brain|bundle|v1|' + meta.uid), b64d(st.brain.blob.ct));
  return { st:st, bundle:JSON.parse(TD.decode(plain)) };
}
function notesOf(bundle){ return (bundle && bundle.notes) || []; }
function hasNote(bundle, content){
  return notesOf(bundle).some(function(n){ return String(n.content || '').indexOf(content) >= 0; });
}

/* ---------- iframe 驱动 ---------- */
var FRAME = document.getElementById('f');
function W(){ return FRAME.contentWindow; }
function D(){ return FRAME.contentDocument; }
function status(){
  try{ return W().brain.online.status(); }catch(e){ return null; }
}
function gateVisible(id){
  try{ var el = D().getElementById(id); if(!el) return false;
    var cs = getComputedStyle(el), rr = el.getBoundingClientRect();
    return !el.hidden && cs.display !== 'none' && rr.width > 0 && rr.height > 0;
  }catch(e){ return false; }
}
/* 自动化浏览器常把页面挂在后台（visibilityState=hidden），应用会按设计停掉 2s 轮询。
   冒烟需要验证"轮询能发现远端重置"，所以在 iframe 里把可见性钉成正常值。 */
function forceVisibleFrame(){
  try{
    var d = D();
    ['hidden','webkitHidden'].forEach(function(k){
      Object.defineProperty(d, k, { configurable:true, get:function(){ return false; } });
    });
    ['visibilityState'].forEach(function(k){
      Object.defineProperty(d, k, { configurable:true, get:function(){ return 'visible'; } });
    });
  }catch(e){}
}
async function bootFrame(online){
  FRAME.src = '/2brain.html?store=ls&t=' + Date.now() + (online === false ? '' : '&online=1');
  await new Promise(function(res){
    var done = false;
    function go(){ if(done) return; done = true; FRAME.onload = null; res(); }
    FRAME.onload = go;
    setTimeout(go, 12000);
  });
  var ok = await until(function(){
    try{ return !!(W() && W().brain && W().brain.online); }catch(e){ return false; }
  }, 12000);
  forceVisibleFrame();
  return ok;
}
function setOnLine(v){
  try{
    Object.defineProperty(W().navigator, 'onLine', { configurable:true, get:function(){ return v; } });
    return true;
  }catch(e){ return false; }
}
function fire(w, name){ try{ w.dispatchEvent(new w.Event(name)); }catch(e){} }

(async function(){
  if(location.hostname !== '127.0.0.1' && location.hostname !== 'localhost'){
    log('served from stub origin', false, location.hostname);
    return finish();
  }
  try{ await api('/__reset', { method:'POST', body:{} }); }catch(e){}
  localStorage.clear(); sessionStorage.clear();
  /* M1c 前在线模式必须显式启用：普通 http(s) 页面保持旧模式，避免接管未迁移的 https 数据区 */
  var legacyBoot = await bootFrame(false);
  var legacyActive = false;
  try{ legacyActive = !!(W() && W().brain && W().brain.online && W().brain.online.active()); }catch(e){}
  log('plain http page stays legacy without ?online=1', legacyBoot && !legacyActive && !gateVisible('onlineGate'));
  FRAME.src = 'about:blank';
  await wait(250);
  localStorage.clear(); sessionStorage.clear();
  var anon401 = false;
  try{ await api('/brain'); }catch(e){ anon401 = e.status === 401; }
  log('anonymous /api/brain returns 401', anon401);
  seedLocal();
  if(!await bootFrame()){
    var info = '';
    try{
      info = 'url=' + FRAME.contentWindow.location.href
        + ' ready=' + FRAME.contentDocument.readyState
        + ' title=' + FRAME.contentDocument.title
        + ' body=' + String(FRAME.contentDocument.body ? FRAME.contentDocument.body.innerText : '').slice(0, 80);
    }catch(e){ info = 'inspect-error ' + e.message; }
    var probe = 'n/a';
    try{ var pr = await fetch('/2brain.html'); probe = pr.status + '/' + pr.headers.get('content-length'); }
    catch(e){ probe = 'fetch-error ' + e.message; }
    log('app boots online', false, info + ' /2brain.html=' + probe);
    return finish();
  }
  await until(function(){ return gateVisible('onlineGate'); }, 6000);

  /* 1) 登录层 / 认证前不渲染明文 / 在线不 seed */
  log('login gate shown before auth', gateVisible('onlineGate') && gateVisible('ogLogin'));
  log('app chrome hidden while locked',
    D().body.classList.contains('online-locked') &&
    getComputedStyle(D().querySelector('.topbar')).display === 'none');
  log('no local plaintext rendered before auth',
    (D().documentElement.textContent || '').indexOf('迁移前本地笔记') < 0);
  log('online mode loads local cache without demo seed',
    W().brain.getNotes().length === 1 && W().brain.getNotes()[0].id === 'n_local1',
    'notes=' + W().brain.getNotes().length);
  log('demo seed texts absent', !/项目A 这周要把需求评审/.test(D().body.innerText || ''));

  /* 手机宽度下登录层不横向溢出 */
  FRAME.style.width = '390px';
  await wait(350);
  log('login gate fits 390px viewport',
    D().documentElement.scrollWidth <= 392 && gateVisible('onlineGate'),
    'scrollWidth=' + D().documentElement.scrollWidth);
  FRAME.style.width = '1000px';
  await wait(200);

  /* 2) 建号：恢复码只显示一次 → 新库导入三选一（默认不自动上传） */
  D().getElementById('ogInvite').value = INVITE;
  D().getElementById('ogNewName').value = NAME;
  D().getElementById('ogNewPw').value = PW;
  D().getElementById('ogNewPw2').value = PW;
  D().getElementById('ogSetupBtn').click();
  var recShown = await until(function(){ return gateVisible('ogRecovery'); }, 12000);
  log('setup reaches recovery code panel', recShown);
  var recCode = (D().getElementById('ogRecoveryCode').textContent || '').replace(/[^0-9A-Z]/g, '');
  log('recovery code is 24 Crockford chars',
    /^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{24}$/.test(recCode), recCode);
  var recBtn = D().getElementById('ogRecContinue');
  log('recovery continue disabled until saved confirmed', !!recBtn && recBtn.disabled);
  D().getElementById('ogRecSaved').checked = true;
  D().getElementById('ogRecSaved').dispatchEvent(new Event('change', { bubbles:true }));
  D().getElementById('ogRecContinue').click();

  var chooserShown = await until(function(){
    var m = D().getElementById('onlineModal');
    return m.classList.contains('on') &&
      /新账号要导入数据吗/.test(D().getElementById('omTitle').textContent || '');
  }, 10000);
  log('new account asks before importing (no auto upload)', chooserShown);
  var omBody = D().getElementById('omBody').textContent || '';
  var omFoot = D().getElementById('omFoot').textContent || '';
  log('chooser lists the other local vault with counts',
    /本机库/.test(omBody) && /1 条笔记/.test(omBody), omBody.slice(0, 140));
  log('chooser offers keep-empty / vault import / JSON import',
    /保持为空/.test(omFoot) && /本机库」导入/.test(omFoot) && /JSON 文件导入/.test(omFoot), omFoot);
  log('server still empty before confirmation', await (async function(){
    var st = await api('/__state'); return !st.brain || st.brain.rev === 0;
  })());
  var importBtn = omBtn('从「本机库」导入');
  log('chooser offers import from the local vault', !!importBtn);
  if(importBtn) importBtn.click();

  var uploaded = await until(async function(){
    var st = await api('/__state');
    return !!(st.brain && st.brain.rev >= 1);
  }, 12000);
  log('chosen import uploads encrypted blob', uploaded);
  await until(function(){ var s = status(); return s && !s.pending && s.state === 'saved'; }, 8000);

  var meta = W().brain.online.meta();
  log('meta persisted without plaintext key',
    !!meta && !!meta.wrappedDEK && !('dek' in meta) && !localStorage.getItem('sb_dek'),
    meta ? Object.keys(meta).join(',') : 'null');
  var owner = null;
  try{ owner = JSON.parse(localStorage.getItem('sb_local_owner') || 'null'); }catch(e){}
  log('local cache marked with account owner',
    !!owner && owner.uid === Number(meta.uid) && owner.name === meta.name,
    JSON.stringify(owner));
  log('DEK cached only in the vault\'s session key',
    !!sessionStorage.getItem(dekKey()) && !localStorage.getItem(dekKey()), dekKey());

  var keys = await deriveKeys(PW, b64d(meta.kdfSalt), Number(meta.kdfIter));
  var DEK = await unwrapDek(keys.kek, meta.wrappedDEK, meta.dekIv, meta.name);
  log('independent client unwraps DEK from password', DEK.length === 32);
  var first = await readServer(meta, DEK);
  log('server blob decrypts with password-derived DEK', !!first.bundle);
  if(first.bundle){
    log('imported local note reached server', hasNote(first.bundle, '迁移前本地笔记'));
    log('node tree reached server', (first.bundle.nodes || []).some(function(n){ return n.id === 'work'; }));
    log('favorites reached server', (first.bundle.favorites || []).some(function(f){ return f.nodeId === 'work'; }));
    log('bundle carries no mnemon receipt fields', !/mnemon/i.test(JSON.stringify(first.bundle)));
    log('settings whitelist only',
      Object.keys(first.bundle.settings || {}).sort().join(',') === 'classifierMode,favoriteMode,updatedAt',
      Object.keys(first.bundle.settings || {}).join(','));
    log('blob payload has only v/iv/ct',
      Object.keys(first.st.brain.blob).sort().join(',') === 'ct,iv,v');
  }

  /* 3) 刷新：sessionStorage 里的 DEK 让本标签页直接恢复 */
  await bootFrame();
  var resumed = await until(function(){ var s = status(); return s && !s.locked; }, 10000);
  await wait(500);
  log('refresh resumes without password prompt', resumed && !gateVisible('onlineGate'));
  log('note visible after refresh',
    (D().documentElement.textContent || '').indexOf('迁移前本地笔记') >= 0);
  log('no plaintext DEK in localStorage', !localStorage.getItem('sb_dek'));

  /* 3.1) 在线设置页：只留记忆桥，旧 Provider / HTTP 字段不再渲染（第四十一阶段） */
  var frameErr = '';
  W().onerror = function(m){ frameErr += String(m) + ';'; return false; };
  D().querySelector('.navbtn[data-view="settings"]').click();
  await wait(350);
  var setCards = Array.prototype.slice.call(D().querySelectorAll('#setModal .setcard'));
  var memCard = setCards.filter(function(c){
    return /记忆桥 \/ Agent 接入/.test((c.querySelector('h3')||{}).textContent || '');
  })[0];
  var saveBtn = D().getElementById('btnSaveSync');
  log('online settings has bridge-only card', !!memCard);
  log('online settings hides legacy provider/http fields',
    !D().getElementById('setSyncProv') && !D().getElementById('httpBox') && !D().getElementById('setSyncUrl'));
  log('online settings keeps bridge controls + save',
    !!D().getElementById('mnBox') && !!D().getElementById('setBridgeUrl')
    && !!D().getElementById('setAutoMemory') && !!saveBtn
    && !!D().getElementById('btnAgentOn') && !!D().getElementById('btnAgentOff')
    && /记忆桥/.test(saveBtn.textContent || ''));
  log('online agent master defaults to closed',
    /已关闭/.test((D().getElementById('mnAgentState')||{}).textContent || '')
    && !D().getElementById('btnAgentOn').disabled);
  if(saveBtn) saveBtn.click();
  await wait(400);
  log('online settings save runs without error', frameErr === '', frameErr);
  var setCloseBtn = D().getElementById('setClose');
  if(setCloseBtn) setCloseBtn.click();
  await wait(250);
  W().onerror = null;

  /* 4) 另一台设备写入 → 本页 2s 轮询拉到并合并（含收藏/偏好） */
  var meta2 = W().brain.online.meta();
  var decB = await readServer(meta2, DEK);
  var bBundle = JSON.parse(JSON.stringify(decB.bundle));
  var nowB = Date.now() + 5000;
  bBundle.notes.push({ id:'n_fromB', nodeId:'work', content:'B 设备写的笔记',
    status:'待处理', tags:[], links:[], summary:'', createdAt:nowB, updatedAt:nowB });
  var favB = (bBundle.favorites || []).filter(function(f){ return f.nodeId === 'work'; })[0];
  if(favB){ favB.useCount = 7; favB.updatedAt = nowB; favB.lastUsed = nowB; }
  else bBundle.favorites.push({ nodeId:'work', pinned:false, pinOrder:0, hidden:false,
    useCount:7, lastUsed:nowB, updatedAt:nowB });
  bBundle.settings.classifierMode = 'ai';
  bBundle.settings.favoriteMode = 'manual';
  bBundle.settings.updatedAt.classifierMode = nowB + 1000;
  bBundle.settings.updatedAt.favoriteMode = nowB + 1000;
  var blobB = await encryptAs(DEK, meta2.uid, bBundle);
  await api('/__put', { method:'POST', body:{ uid:meta2.uid, v:blobB.v,
    iv:blobB.iv, ct:blobB.ct } });

  var pulled = await until(function(){
    return W().brain.getNotes().some(function(n){ return n.id === 'n_fromB'; });
  }, 6000);
  log('remote note appears via polling (<=2s + network)', pulled);
  log('remote note rendered without reload',
    (D().documentElement.textContent || '').indexOf('B 设备写的笔记') >= 0);
  await wait(300);
  var favLocal = JSON.parse(localStorage.getItem(activePrefix() + 'favorites') || '[]')
    .filter(function(f){ return f.nodeId === 'work'; })[0];
  var stLocal = JSON.parse(localStorage.getItem(activePrefix() + 'settings') || '{}');
  log('favorite merge keeps max useCount', !!favLocal && favLocal.useCount === 7,
    favLocal ? favLocal.useCount : 'none');
  log('preference merge applies newer remote values',
    stLocal.classifierMode === 'ai' && stLocal.favoriteMode === 'manual',
    stLocal.classifierMode + '/' + stLocal.favoriteMode);

  /* 5) 412：先把 B 的写入打到服务器，再改本机 → 推送必然带旧 rev 撞 412 → 冲突合并 → 再推 */
  var b2 = JSON.parse(JSON.stringify(bBundle));
  var nowB2 = Date.now() + 10000;
  var sameRemote = b2.notes.filter(function(n){ return n.id === 'n_local1'; })[0];
  if(sameRemote){ sameRemote.content = '远端改过的正文'; sameRemote.updatedAt = nowB2; }
  b2.notes.push({ id:'n_fromB2', nodeId:'work', content:'B2 冲突笔记',
    status:'待处理', tags:[], links:[], summary:'', createdAt:nowB2, updatedAt:nowB2 });
  var blobB2 = await encryptAs(DEK, meta2.uid, b2);
  await api('/__put', { method:'POST', body:{ uid:meta2.uid, v:blobB2.v,
    iv:blobB2.iv, ct:blobB2.ct } });

  var sameNote = W().brain.getNotes().filter(function(n){ return n.id === 'n_local1'; })[0];
  if(sameNote){
    sameNote.mnemonId = 'mem_local_only';       // 本机 mnemon 回执不能被远端覆盖
    sameNote.mnemonAt = Date.now();
  }
  W().brain.updateNote('n_local1', { content:'本地改过的正文' });
  var localN = W().brain.addNote('本地冲突笔记');
  log('local note added before conflict push', !!localN);

  var converged = await until(function(){
    var s = status(); return s && !s.pending && s.state === 'saved';
  }, 15000);
  log('conflict resolves back to saved state', converged);
  var afterConflict = await readServer(meta2, DEK);
  var put412 = (afterConflict.st.log || []).some(function(l){
    return l.method === 'PUT' && l.path === '/api/brain' && l.status === 412;
  });
  /* 有广播通道时客户端可能先拉取再推送（合法路径，不会 412）；关键是最终收敛到同一 rev */
  log('conflict converges to the server rev',
    Number((W().brain.online.meta() || {}).lastRev) === Number(afterConflict.st.brain.rev),
    '412=' + put412 + ' rev=' + ((W().brain.online.meta() || {}).lastRev)
      + '/' + afterConflict.st.brain.rev);
  log('both local and remote notes survive merge',
    hasNote(afterConflict.bundle, '本地冲突笔记') && hasNote(afterConflict.bundle, 'B2 冲突笔记'),
    'notes=' + notesOf(afterConflict.bundle).length);
  var sameMerged = notesOf(afterConflict.bundle).filter(function(n){ return n.id === 'n_local1'; })[0];
  log('same-note conflict converges to newer version',
    !!sameMerged && sameMerged.content === '远端改过的正文',
    sameMerged ? sameMerged.content : 'missing');

  try{ owner12 = JSON.parse(localStorage.getItem('sb_local_owner') || 'null'); }catch(e){}
  log('signup asks once with explicit choices', recShown2 && !!setupDone2 && chooser12, 
    D().getElementById('omTitle').textContent || '');
  log('chooser lists the other local vault instead of auto-importing',
    /本机库/.test(chooserBody12) && /1 条笔记/.test(chooserBody12), chooserBody12.slice(0, 140));
  log('new account starts in its own empty vault',
    W().brain.getNotes().length === 0 && Number(meta12.uid) !== Number(meta.uid),
    'uid=' + meta12.uid + ' notes=' + W().brain.getNotes().length);
  var keepEmpty12 = omBtn('保持为空');
  if(keepEmpty12) keepEmpty12.click();
  await wait(400);
  log('keep-empty dismisses the chooser without importing',
    !D().getElementById('onlineModal').classList.contains('on') &&
    W().brain.getNotes().length === 0);
  var prevVault12 = null;
  W().brain.vaults.list().forEach(function(v){
    if(v.kind === 'account' && Number(v.uid) === Number(meta.uid)) prevVault12 = v;
  });
  log('signup keeps the previous vault on this machine',
    W().brain.vaults.list().length === 3 && !!prevVault12 &&
    localStorage.getItem(vaultPrefix(prevVault12) + 'nodes') !== null &&
    /n_local1/.test(localStorage.getItem('sb_notes') || ''),
    'vaults=' + W().brain.vaults.list().length);
  log('ownership marker now belongs to new account',
    !!owner12 && owner12.uid === Number(meta12.uid) && owner12.name === 'smoke2',
    JSON.stringify(owner12));
  log('nothing was uploaded for the new account', await (async function(){
    var st = await api('/__state');
    return !st.brain.blob && Number(st.brain.rev) === 0;
  })());

  /* 12.1) 退出再登同一账号：回到它自己的库，不弹任何导入/清空确认，旧库仍完整 */
  await W().brain.online.logout(true);
  await wait(700);
  await until(function(){ return gateVisible('onlineGate'); }, 10000);
  D().getElementById('ogName').value = 'smoke2';
  D().getElementById('ogPw').value = PW;
  D().getElementById('ogLoginBtn').click();
  var relogin2 = await until(function(){ var s = status(); return s && !s.locked; }, 12000);
  var modalUp12 = D().getElementById('onlineModal').classList.contains('on');
  log('re-login lands in the same empty vault without prompts',
    !!relogin2 && !gateVisible('onlineGate') && !modalUp12 &&
    W().brain.getNotes().length === 0 &&
    Number((W().brain.online.meta() || {}).uid) === Number(meta12.uid),
    'notes=' + W().brain.getNotes().length);
  log('previous vault survives the account switch',
    W().brain.vaults.list().length === 3 &&
    W().brain.vaults.list().some(function(v){ return v.id === prevVault12.id; }));

  /* 12.2) 串库回归（v2026-10-24.2）：登录中切到别的账号库 → 被登出 → 再登回自己，
          自己库里不得出现对方笔记。旧实现 bindAccount 提前 applyKeys，open() 的 flushSave
          会把对方库的内存数据写进本库键位。 */
  var otherV = null, mineV = null;
  W().brain.vaults.list().forEach(function(v){
    if(v.kind !== 'account') return;
    if(Number(v.uid) === Number(meta.uid)) otherV = v;
    if(Number(v.uid) === Number(meta12.uid)) mineV = v;
  });
  openSettingsPane();
  await wait(400);
  /* 其他账号的库不再列名、也不给切换按钮：真要走这条路是「退出登录 → 打开那个库 → 登录」 */
  log('settings no longer offers a switch button for another account vault',
    !D().querySelector('[data-vault="' + (otherV && otherV.id) + '"]'));
  await W().brain.online.logout(true);
  if(otherV) W().brain.vaults.open(otherV.id);
  var gateAfterSwitch = await until(function(){ return gateVisible('onlineGate'); }, 12000);
  var actOther = W().brain.vaults.active() || {};
  log('switch-to-other-account-vault logs out and opens that vault',
    !!otherV && !!mineV && gateAfterSwitch && actOther.id === otherV.id &&
    /work/.test(localStorage.getItem(vaultPrefix(otherV) + 'nodes') || ''),
    'active=' + actOther.id + ' notes=' + W().brain.getNotes().length);

  D().getElementById('ogName').value = 'smoke2';
  D().getElementById('ogPw').value = PW;
  D().getElementById('ogLoginBtn').click();
  var relogin3 = await until(function(){ var s = status(); return s && !s.locked; }, 14000);
  var vp = mineV ? (mineV.legacy ? 'sb_' : ('sb:v:' + mineV.id + ':')) : 'sb:v:missing:';
  var mineRaw = localStorage.getItem(vp + 'notes') || '';
  var actMine = W().brain.vaults.active() || {};
  log('re-login after foreign-vault visit lands back in own vault',
    !!relogin3 && actMine.id === (mineV && mineV.id) && !gateVisible('onlineGate'),
    'active=' + actMine.id + ' expect=' + (mineV && mineV.id));
  log('own vault is not polluted by the other account\'s notes',
    W().brain.getNotes().length === 0 && mineRaw.indexOf('迁移前本地笔记') < 0 &&
    mineRaw.indexOf('n_local1') < 0,
    'notes=' + W().brain.getNotes().length + ' raw=' + mineRaw.slice(0, 80));
  log('other account vault stays intact after the round trip',
    /work/.test(localStorage.getItem(vaultPrefix(otherV) + 'nodes') || '') &&
    (function(){ try{ return W().brain.vaults.list().length === 3; }catch(e){ return false; } })());

  /* 14) P3 切库即锁（v2026-10-24.6）：切走 = 关闭当前库（清会话 DEK、停同步），
          本地库可直接用；切回账号库要重新输密码解锁，解锁前不渲染明文。 */
  var accountV = mineV;
  var keepUid = Number(status().uid);
  var localV = W().brain.vaults.create({ name:'P3本地库', kind:'local' });
  var openedLocal = W().brain.vaults.open(localV.id, { userSwitch:true });
  await wait(400);
  log('switching to a local vault closes the account vault',
    !!openedLocal && W().brain.vaults.active().id === localV.id &&
    !!accountV && sessionStorage.getItem(vaultPrefix(accountV) + 'dek') === null &&
    W().brain.online.meta() === null,
    'dek=' + sessionStorage.getItem(accountV ? (vaultPrefix(accountV) + 'dek') : '') +
    ' meta=' + !!W().brain.online.meta());
  /* 切库瞬间可能先加锁再放开：这里等终态，避免把一次渲染时序当成失败 */
  var localReady = await until(function(){
    return !gateVisible('onlineGate') && !D().body.classList.contains('online-locked');
  }, 12000);
  log('local vault readable without the account gate', !!localReady,
    'gate=' + gateVisible('onlineGate') + ' lockedClass=' + D().body.classList.contains('online-locked'));
  log('shared-computer hint shown on switch',
    /共用电脑/.test((D().getElementById('toastMsg') || {}).textContent || ''),
    (D().getElementById('toastMsg') || {}).textContent);
  W().brain.addNote('P3 本地笔记', { nodeId:'uncat' });
  W().brain.flush();
  log('local vault writes its own key',
    /P3 本地笔记/.test(localStorage.getItem(vaultPrefix(localV) + 'notes') || ''));

  W().brain.vaults.open(accountV.id, { userSwitch:true });
  var lockGate = await until(function(){ return gateVisible('ogUnlock'); }, 4000);
  log('returning to the account vault locks it',
    lockGate && !!status() && status().locked === true &&
    D().body.classList.contains('online-locked'),
    'locked=' + (status() && status().locked));
  var unlockedP3 = await W().brain.online.unlock(PW);
  var gateGone = await until(function(){ return !gateVisible('onlineGate'); }, 8000);
  log('password unlock restores the account vault',
    !!unlockedP3 && gateGone && !D().body.classList.contains('online-locked') &&
    Number(status().uid) === keepUid,
    'uid=' + (status() && status().uid) + ' expect=' + keepUid);
  W().brain.vaults.remove(localV.id);

  /* 15) 服务器多库（schema 3）：同一账号在服务器上另建库，本机各建一个库对应；
          默认库仍走 /api/brain，附加库走 /api/v/<vid>/brain，两边互不覆盖。 */
  log('account vault maps to the main server slot',
    W().brain.online.svid() === 'main' && W().brain.online.brainPath() === '/brain',
    'svid=' + W().brain.online.svid() + ' path=' + W().brain.online.brainPath());
  W().brain.addNote('主库笔记', { nodeId:'uncat' });
  W().brain.flush();
  await until(function(){ return status() && !status().pending && status().rev > 0; }, 12000);
  var mainRev15 = Number((status() || {}).rev) || 0;
  var vaultsBefore15 = W().brain.vaults.list().length;
  var oldConfirm15 = W().confirm;
  W().confirm = function(){ return true; };
  var createdSrv = await W().brain.online.createServerVault('工作库');
  var srvVault15 = null;
  W().brain.online.serverVaults().forEach(function(s){
    if(String(s.vid) !== 'main') srvVault15 = s;
  });
  var openedSrv15 = await until(function(){
    var a = W().brain.vaults.active() || {};
    return createdSrv && a.svid && String(a.svid) === String(srvVault15 && srvVault15.vid);
  }, 8000);
  log('creating a server vault opens a matching local vault',
    !!openedSrv15 && W().brain.vaults.list().length === vaultsBefore15 + 1 &&
    W().brain.getNotes().length === 0 && W().brain.online.svid() !== 'main',
    'svid=' + W().brain.online.svid() + ' notes=' + W().brain.getNotes().length);
  log('extra vault uses the scoped API path',
    W().brain.online.brainPath() === '/v/' + W().brain.online.svid() + '/brain',
    W().brain.online.brainPath());
  W().brain.addNote('工作库笔记', { nodeId:'uncat' });
  W().brain.flush();
  var srvPushed15 = await until(function(){ return status() && !status().pending && status().rev > 0; }, 12000);
  var rawMain15 = await fetch('/api/brain', { credentials:'same-origin' }).then(function(r){ return r.json(); });
  var rawWork15 = await fetch('/api/v/' + W().brain.online.svid() + '/brain',
    { credentials:'same-origin' }).then(function(r){ return r.json(); });
  log('extra vault pushes to its own server slot',
    !!srvPushed15 && Number(rawWork15.rev) > 0 && Number(rawMain15.rev) === mainRev15,
    'main=' + rawMain15.rev + ' work=' + rawWork15.rev + ' before=' + mainRev15);
  var workSvid15 = W().brain.online.svid();
  var backMain15 = W().brain.online.openServerVault('main', '默认库');
  var backReady15 = await until(function(){
    return W().brain.online.svid() === 'main' && status() && !status().locked;
  }, 8000);
  log('switching back to the default vault restores its notes',
    !!backMain15 && !!backReady15 &&
    W().brain.getNotes().some(function(n){ return /主库笔记/.test(n.content); }) &&
    !W().brain.getNotes().some(function(n){ return /工作库笔记/.test(n.content); }),
    'svid=' + W().brain.online.svid() + ' notes=' + W().brain.getNotes().length);
  var deletedSrv15 = await W().brain.online.deleteServerVault(workSvid15);
  W().confirm = oldConfirm15;
  var workLocal15 = null;
  W().brain.vaults.list().forEach(function(v){ if(String(v.svid) === String(workSvid15)) workLocal15 = v; });
  log('deleting a server vault removes its local binding',
    !!deletedSrv15 && !workLocal15 && W().brain.vaults.list().length === vaultsBefore15,
    'left=' + (workLocal15 && workLocal15.id) + ' vaults=' + W().brain.vaults.list().length);

  /* 13) 旧数据迁移提示（P1 §6.1）：legacy 库有真实数据且没有迁移日志时才提示 */
  var legacyV = null;
  W().brain.vaults.list().forEach(function(v){ if(v.legacy) legacyV = v; });
  log('legacy vault still holds the pre-upgrade data',
    !!legacyV && /n_local1/.test(localStorage.getItem('sb_notes') || ''));
  W().brain.vaults.open(legacyV.id);
  await wait(600);
  localStorage.removeItem('sb_migration_log');
  W().brain.online.migrationPrompt();
  var migShown = await until(function(){
    return D().getElementById('onlineModal').classList.contains('on') &&
      /升级完成/.test(D().getElementById('omTitle').textContent || '');
  }, 4000);
  log('migration prompt appears for legacy data without a log', migShown);
  var migBtn = omBtn('导出备份并完成迁移');
  if(migBtn) migBtn.click();
  await wait(600);
  var migLog = null;
  try{ migLog = JSON.parse(localStorage.getItem('sb_migration_log') || 'null'); }catch(e){}
  log('exporting the backup records the migration log',
    !!migLog && migLog.vaultId === legacyV.id && Number(migLog.notes) >= 1,
    JSON.stringify(migLog));

  /* 16) 跨账号串库（v2026-10-26.14）：同一台电脑登录 A → 退出 → 登录 B，
          B 的界面、B 的本机数据区、B 的服务器密文里都不得出现 A 的笔记；回登 A 时 A 仍完整。
         同时验证上传出口的归属闸门：当前数据区不是已登录账号的库时，拒绝上传。 */
  var A_ONLY = 'A-ONLY-' + Date.now(), B_ONLY = 'B-ONLY-' + Date.now(), GUARD_ONLY = 'GUARD-ONLY-' + Date.now();
  async function uiLogin(nm, uidWant){
    await until(function(){ return gateVisible('ogLogin'); }, 8000);
    D().getElementById('ogName').value = nm;
    D().getElementById('ogPw').value = PW;
    D().getElementById('ogLoginBtn').click();
    return !!(await until(async function(){
      var s = status();
      if(s && !s.locked && Number(s.uid) === uidWant) return true;
      var m = D().getElementById('onlineModal');
      if(m && m.classList.contains('on')){
        var mergeBtn = omBtn('合并并同步');
        if(mergeBtn){ mergeBtn.click(); return false; }
        var cancelBtn = omBtn('取消');
        if(cancelBtn){ cancelBtn.click(); return false; }
      }
      return false;
    }, 16000));
  }
  function dekNow(){
    var v = (W().brain.vaults.active()) || {};
    var raw = W().sessionStorage.getItem(vaultPrefix(v) + 'dek');
    return raw ? b64d(raw) : null;
  }
  function hasOnScreen(txt){
    var notes = W().brain.getNotes();
    return (D().documentElement.textContent || '').indexOf(txt) >= 0 ||
      notes.some(function(n){ return String(n.content || '').indexOf(txt) >= 0; });
  }

  await W().brain.online.logout(true);
  await until(function(){ return gateVisible('onlineGate'); }, 10000);
  var loginA1 = await uiLogin(NAME, Number(meta.uid));
  var vaultA = W().brain.vaults.active() || {};
  var uidA = Number(status() && status().uid) || 0;
  var dekA = dekNow();
  W().brain.addNote(A_ONLY, { nodeId:'uncat' });
  W().brain.flush();
  var aPushed = await until(async function(){
    try{ return hasNote((await readServer({ uid:uidA }, dekA)).bundle, A_ONLY); }catch(e){ return false; }
  }, 14000);
  log('account A pushes its own note before the switch',
    !!loginA1 && Number(vaultA.uid) === uidA && !!dekA && aPushed,
    'uid=' + uidA + ' vault=' + vaultA.id);

  /* 上传出口归属闸门：把键位切到 B 的库但仍是 A 的会话（旧版串库的成因），此时必须拒绝上传 */
  var vaultB0 = null;
  W().brain.vaults.list().forEach(function(v){
    if(v.kind === 'account' && Number(v.uid) === Number(meta12.uid)) vaultB0 = v;
  });
  var openedB2 = W().brain.vaults.open(vaultB0 ? vaultB0.id : '');
  await wait(300);
  W().brain.addNote(GUARD_ONLY, { nodeId:'uncat' });
  W().brain.flush();
  var gateErr = await until(function(){ return (status() || {}).state === 'err'; }, 8000);
  await wait(400);
  var guardLeak = await (async function(){
    try{ return hasNote((await readServer({ uid:uidA }, dekA)).bundle, GUARD_ONLY); }catch(e){ return true; }
  })();
  log('upload gate refuses a vault that is not the logged-in account\'s',
    !!openedB2 && !!gateErr && !guardLeak,
    'opened=' + openedB2 + ' err=' + gateErr + ' leaked=' + guardLeak
    + ' active=' + ((W().brain.vaults.active() || {}).uid) + ' onlineUid=' + ((status() || {}).uid));
  W().brain.vaults.open(vaultA.id);
  await wait(300);

  await W().brain.online.logout(true);
  await until(function(){ return gateVisible('onlineGate'); }, 10000);
  var loginB1 = await uiLogin('smoke2', Number(meta12.uid));
  var vaultB = W().brain.vaults.active() || {};
  var uidB = Number(status() && status().uid) || 0;
  var dekB = dekNow();
  log('logging in as B separates the accounts',
    uidA > 0 && uidB > 0 && uidA !== uidB && !!loginB1 &&
    Number(vaultB.uid) === uidB && vaultB.id !== vaultA.id,
    'A=' + uidA + '/' + vaultA.id + ' B=' + uidB + '/' + vaultB.id);
  log('B is not shown A\'s note after A logs out', !hasOnScreen(A_ONLY) &&
    W().brain.getNotes().every(function(n){ return String(n.content || '').indexOf(A_ONLY) < 0; }),
    'notes=' + W().brain.getNotes().length);
  log('A\'s local vault keeps its own note while B is active',
    (localStorage.getItem(vaultPrefix(vaultA) + 'notes') || '').indexOf(A_ONLY) >= 0 &&
    (localStorage.getItem(vaultPrefix(vaultB) + 'notes') || '').indexOf(A_ONLY) < 0);
  log('B\'s uploaded bundle never contains A\'s note', await (async function(){
    try{ return !hasNote((await readServer({ uid:uidB }, dekB)).bundle, A_ONLY); }catch(e){ return false; }
  })());

  W().brain.addNote(B_ONLY, { nodeId:'uncat' });
  W().brain.flush();
  var bPushed = await until(async function(){
    try{ return hasNote((await readServer({ uid:uidB }, dekB)).bundle, B_ONLY); }catch(e){ return false; }
  }, 14000);
  log('B\'s own note reaches B\'s account only', bPushed && await (async function(){
    try{ return !hasNote((await readServer({ uid:uidB }, dekB)).bundle, A_ONLY); }catch(e){ return false; }
  })());

  await W().brain.online.logout(true);
  await until(function(){ return gateVisible('onlineGate'); }, 10000);
  /* 17) 退出后不能停在账号库（v2026-10-26.15）：落到 uid=0 的本机库，
         上一个账号的笔记不留在内存里，而两个账号的库都还在本机（没被删）。 */
  var fellGuest = await until(function(){
    var v = W().brain.vaults.active() || {};
    return !Number(v.uid) && v.kind !== 'shared';
  }, 5000);
  var avOut = W().brain.vaults.active() || {};
  log('logging out after switching accounts also lands on a uid=0 local vault',
    !!fellGuest, 'active=' + avOut.id + ' uid=' + avOut.uid + ' kind=' + avOut.kind);
  log('the signed-out account\'s notes are gone from memory',
    !hasOnScreen(B_ONLY) && !hasOnScreen(A_ONLY) &&
    W().brain.getNotes().every(function(n){
      var c = String(n.content || '');
      return c.indexOf(B_ONLY) < 0 && c.indexOf(A_ONLY) < 0;
    }),
    'notes=' + W().brain.getNotes().length);
  var keptIds = W().brain.vaults.list().map(function(v){ return v.id; });
  log('both account vaults stay on this machine after logout',
    keptIds.indexOf(vaultA.id) >= 0 && keptIds.indexOf(vaultB.id) >= 0,
    'vaults=' + keptIds.length);

  var loginA2 = await uiLogin(NAME, uidA);
  var aBack = await until(function(){ return W().brain.getNotes().length > 0; }, 8000);
  log('logging back into A restores A\'s own note',
    !!loginA2 && !!aBack && hasOnScreen(A_ONLY) && !hasOnScreen(B_ONLY),
    'notes=' + W().brain.getNotes().length);
  log('A\'s account bundle never receives B\'s note', await (async function(){
    try{ var r = await readServer({ uid:uidA }, dekA); return hasNote(r.bundle, A_ONLY) && !hasNote(r.bundle, B_ONLY); }
    catch(e){ return false; }
  })());

  finish();
})().catch(function(e){
  lines.push('CHECK FAIL uncaught: ' + (e && (e.stack || e.message)));
  ERRS++;
  finish();
});

function finish(){
  var pre = document.getElementById('out');
  pre.textContent = 'ONLINE_ERRS=' + ERRS + '\n' + lines.join('\n');
  document.title = 'ONLINE_DONE_' + ERRS;
}
</script>
</body>
</html>
